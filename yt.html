<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EDITH oynatıcı</title>
<style>
/* TV uygulamasının içinde açılan YouTube oynatıcısı. YouTube, gömülü videoyu https adresli bir sayfadan ister; bu sayfa o adres. */
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
#p { position: absolute; inset: 0; width: 100%; height: 100%; }
</style>
</head>
<body>
<div id="p"></div>
<script>
(function () {
  var q = new URLSearchParams(location.hash.slice(1)), player = null, ready = false, pending = [];
  function post(m) { m.yt = 1; try { parent.postMessage(m, "*"); } catch (e) {} }
  function cmd(m) {
    if (!ready) { pending.push(m); return; }
    if (m.cmd === "play") { player.loadVideoById({ videoId: m.id, startSeconds: m.start || 0, endSeconds: m.end || undefined }); if (m.vol != null) player.setVolume(m.vol); player.unMute(); }
    else if (m.cmd === "stop") player.stopVideo();
    else if (m.cmd === "pause") player.pauseVideo();
    else if (m.cmd === "resume") player.playVideo();
    else if (m.cmd === "vol") player.setVolume(m.v);
  }
  window.onYouTubeIframeAPIReady = function () {
    player = new YT.Player("p", {
      width: "100%", height: "100%", videoId: q.get("v") || "",
      playerVars: (function () {
        var pv = { autoplay: 1, controls: 0, rel: 0, modestbranding: 1, playsinline: 1, iv_load_policy: 3, start: +(q.get("s") || 0) };
        if (+q.get("e")) pv.end = +q.get("e");
        return pv;
      })(),
      events: {
        onReady: function (e) { ready = true; e.target.setVolume(+(q.get("vol") || 100)); e.target.unMute(); e.target.playVideo(); post({ ev: "ready" }); pending.splice(0).forEach(cmd); },
        onStateChange: function (e) { post({ ev: "state", s: e.data }); if (e.data === 0) post({ ev: "ended" }); },
        onError: function (e) { post({ ev: "error", code: e.data }); }
      }
    });
  };
  addEventListener("message", function (e) { if (e.data && e.data.ytc) cmd(e.data); });
})();
</script>
<script src="https://www.youtube.com/iframe_api"></script>
</body>
</html>
